{{ define "main" }}
<section class="page-content">
  <p class="eyebrow">PORTFOLIO</p>
  <h1>{{ .Title }}</h1>
  {{ with .Description }}<p class="page-intro">{{ . }}</p>{{ end }}
  <div class="prose">{{ .Content }}</div>
  <ul class="page-list">
  {{ range .Pages }}<li><a href="{{ .RelPermalink }}">{{ .Title }}</a>{{ with .Description }}<p>{{ . }}</p>{{ end }}</li>{{ end }}
  </ul>
</section>
{{ end }}
